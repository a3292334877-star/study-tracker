<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#4f6df5" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="description" content="记下每天学了什么，看见自己的积累。" />
<title>学习记录</title>
<link rel="manifest" href="manifest.webmanifest" />
<link rel="icon" href="icon.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" sizes="180x180" href="icon-180.png" />
<link rel="stylesheet" href="css/styles.css" />
<link rel="stylesheet" href="css/parts/log.css" />
<link rel="stylesheet" href="css/parts/stats.css" />
<link rel="stylesheet" href="css/parts/sheets.css" />
<link rel="stylesheet" href="css/parts/me.css" />
<link rel="stylesheet" href="css/parts/achievements.css" />
<link rel="stylesheet" href="css/parts/calendar.css" />
<link rel="stylesheet" href="css/parts/plan.css" />
<link rel="stylesheet" href="css/parts/memory.css" />
<link rel="stylesheet" href="css/parts/goals.css" />
<link rel="stylesheet" href="css/parts/monthly.css" />
</head>
<body>
<div class="app">
  <div class="storage-warn" id="storage-warn" hidden role="alert">
    <span class="storage-warn-text">存储空间已用满，最近的修改没能保存。</span>
    <a class="storage-warn-link" href="#/me">去导出备份</a>
    <button class="storage-warn-x" type="button" data-close aria-label="关闭提示">
      <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12"/><path d="M18 6 6 18"/></svg>
    </button>
  </div>

  <header class="topbar">
    <div class="topbar-main">
      <h1 class="topbar-title" id="page-title">今日</h1>
      <p class="topbar-sub" id="page-sub"></p>
    </div>
    <button class="icon-btn" id="theme-btn" type="button" aria-label="切换主题">
      <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A8.5 8.5 0 1 1 11.2 3a6.5 6.5 0 0 0 9.8 9.8Z"/></svg>
    </button>
  </header>

  <main class="view" id="view"></main>

  <nav class="tabbar" id="tabbar" aria-label="主导航">
    <a class="tab" href="#/home" data-route="home">
      <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10.6 12 3.5l9 7.1V20a1.5 1.5 0 0 1-1.5 1.5H15v-6.6H9v6.6H4.5A1.5 1.5 0 0 1 3 20Z"/></svg>
      <span>今日</span>
    </a>
    <a class="tab" href="#/log" data-route="log">
      <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4.5A2.5 2.5 0 0 1 7.5 2H19v17H7.5A2.5 2.5 0 0 0 5 21.5Z"/><path d="M5 19.2a2.5 2.5 0 0 1 2.5-2.2H19"/></svg>
      <span>记录</span>
    </a>
    <button class="tab tab-primary" type="button" id="tab-add" aria-label="记一笔">
      <span class="tab-fab">
        <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5.5v13"/><path d="M5.5 12h13"/></svg>
      </span>
      <span>记一笔</span>
    </button>
    <a class="tab" href="#/stats" data-route="stats">
      <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20V11"/><path d="M10 20V5"/><path d="M16 20v-6"/><path d="M2.5 20.5h19"/></svg>
      <span>统计</span>
    </a>
    <a class="tab" href="#/me" data-route="me">
      <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.1 3.7-6.5 8-6.5S20 16.9 20 21"/></svg>
      <span>我的</span>
    </a>
  </nav>
</div>

<div class="sheet-backdrop" id="sheet-backdrop" hidden></div>
<div class="sheet" id="sheet" hidden role="dialog" aria-modal="true"></div>
<div class="toast" id="toast" hidden role="status" aria-live="polite" aria-atomic="true"></div>
<div class="sr-only" id="sr-status" role="status" aria-live="polite"></div>

<script type="module" src="js/app.js"></script>
</body>
</html>
